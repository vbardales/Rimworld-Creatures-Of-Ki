<!doctype html>
<meta charset="utf-8">
<!--
  The showcase banner: Preview-source.png with the title engraved over it. Render
  at 896x504, the size Steam and the in-game mod list both want:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --window-size=896,504 \
           --screenshot=Mod/About/Preview.png Art/Preview-text.html

  None of the numbers below are free. The first banner was built before the mod
  took the Renew suffix, and its working notes were not kept, so these were
  measured back off the image itself and refitted until a fresh render matched it:
  title glyphs open at x=50 y=61, the two lines sit 53px apart, the rule is 58x3
  at x=48 y=176, and the summary opens at y=200. The shade was fitted the same
  way, by rendering candidates and comparing them to the old banner pixel by
  pixel away from the text - an ellipse, not a circle, which is why the
  bottom-left corner stays lighter than its distance from the corner suggests.

  So: changing the words is safe, and everything else should be left alone.

  The source art needs no crop. 1672x941 scaled to 896 wide is 504.4 high, so the
  background sits at 0,0 and the spare half pixel falls off the bottom.
-->
<style>
  html,body { margin:0; padding:0; }
  .frame {
    position:relative; width:896px; height:504px; overflow:hidden;
    background-image:url('Preview-source.png');
    background-repeat:no-repeat;
    background-size:896px auto;
    background-position:0px 0px;
  }
  .shade {
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 0% 0%, rgba(6,5,4,.90) 0%, rgba(6,5,4,0) 66%);
  }
  .text { position:absolute; left:48px; top:52px; font-family:"Segoe UI",sans-serif; }
  h1 {
    margin:0; font-size:49px; font-weight:700; line-height:1.08;
    color:#FFFFFF; letter-spacing:.2px; text-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  .rule { width:58px; height:3px; background:#D68F2C; margin:18px 0 13px 0; }
  p {
    margin:0; width:430px; font-size:21px; line-height:1.5;
    color:#F2ECE4; text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
</style>
<div class="frame">
  <div class="shade"></div>
  <div class="text">
    <h1>Creatures of Ki<br>Teshi Renew</h1>
    <div class="rule"></div>
    <p>The teshi of the forest planet Ki, and its eggs.</p>
  </div>
</div>

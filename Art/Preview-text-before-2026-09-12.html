<!doctype html>
<meta charset="utf-8">
<!--
  The showcase banner: Preview-source.png with the title engraved over it. Render at 896x504, the
  size Steam and the in-game mod list both want:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --window-size=896,504 \
           --screenshot=Mod/About/Preview.png Art/Preview-text.html

  THE LAYOUT is measured, not chosen. The first banner was built before the mod took the Renew
  suffix and its working notes were not kept, so these numbers were read back off the image and
  refitted until a fresh render landed on it: the title opens at x=50 y=61, the two lines sit 53px
  apart, the rule is 58x3 at x=48 y=176, the summary opens at y=200. Changing the words is safe;
  leave the geometry alone.

  THE VEIL is no longer black. Under the 2026-09-12 rule it takes a colour out of the picture and
  the ink follows from it:

    #503F2F is the straw lying in shadow under the animal's flank, sampled off the full-resolution
            source at 1180,520 as the mean of a 50px patch, then desaturated a fifth of the way to
            its own grey. Its WCAG relative luminance is 0.056, well under the 0.18 that decides
            the ink.
    ink     the light pair, then: #F2ECE1 for the title, #D8CFC0 for the summary.
    shadow  kept. A drop shadow belongs to a dark veil, where it lifts the glyphs off the scene
            still showing through it.
    rule    stays amber #D68F2C. The exception is for a veil that is itself amber, and this one is
            a shadowed brown.

  WHY NOT A PALE VEIL, which is what the rule's first example does. It was built and measured:
  #D4BB91, the lit side of the two eggs, dark ink, 4.87:1 at the worst point - it passes, and it
  washes the picture out. A pale veil has to hold its alpha across the whole 430px summary, and an
  ellipse wide enough to do that covers the frame, so the animal, the lantern and the nest all come
  up milky. Four narrower ellipses were measured and every one of them fell through the floor at
  the end of the summary line: 3.5:1 at 700px, 2.8:1 at 620px, 1.0:1 at 560px. On a night scene lit
  by one lantern, the veil has to be the dark one; what it must not be is the same black as the
  other fifty-four, and at 20,20 this one reads #503D2C against the #0D0C0C it replaces.

  Two mid-tones were dropped before either: the lamp pool on the straw (#996B37) and the dry straw
  at the nest edge (#966A3A). Both sit within a hair of the 0.18 threshold, so they fail against
  BOTH inks, 3.9:1 either way. A veil has to commit to being light or dark.

  THE REACH is the one thing here that is not the rule's stated number. The dark-veil form dies at
  74% of the diagonal, which leaves the end of the summary at 4.39:1 - just under the floor, and
  the exact trap the rule describes for pale veils. It applies to this scene's dark veil too,
  because the floor behind the summary is dark slate rather than lamplight. So the veil holds .90
  then .86 to half its reach before falling, over an ellipse of 760 by 620: 5.0:1 at the worst
  point, 8.7:1 behind the title, and the lantern's pool survives.

  Measured on the render and not on this stylesheet, by rendering a second time with the text
  hidden and reading the pixels behind where each glyph sits. Worst point is the far end of the
  summary line; if the summary ever gets longer, measure again.

  The source art needs no crop. 1672x941 scaled to 896 wide is 504.4 high, so the background sits
  at 0,0 and the spare half pixel falls off the bottom.
-->
<style>
  html,body { margin:0; padding:0; }
  .frame {
    position:relative; width:896px; height:504px; overflow:hidden;
    background-image:url('Preview-source.png');
    background-repeat:no-repeat;
    background-size:896px auto;
    background-position:0px 0px;
  }
  .shade {
    position:absolute; inset:0;
    background:radial-gradient(ellipse 760px 620px at top left,
                               rgba(80,63,47,.90) 0%,
                               rgba(80,63,47,.86) 50%,
                               rgba(80,63,47,0) 100%);
  }
  .text { position:absolute; left:48px; top:52px; font-family:"Segoe UI",sans-serif; }
  h1 {
    margin:0; font-size:49px; font-weight:700; line-height:1.08;
    color:#F2ECE1; letter-spacing:.2px; text-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  .rule { width:58px; height:3px; background:#D68F2C; margin:18px 0 13px 0; }
  p {
    margin:0; width:430px; font-size:21px; line-height:1.5;
    color:#D8CFC0; text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
</style>
<div class="frame">
  <div class="shade"></div>
  <div class="text">
    <h1>Creatures of Ki<br>Teshi Renew</h1>
    <div class="rule"></div>
    <p>The teshi of the forest planet Ki, and its eggs.</p>
  </div>
</div>
